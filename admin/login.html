<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8937522374261149" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Urban Hairplaza</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.07) 0%, transparent 60%); }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
    .admin-logo { text-align: center; margin-bottom: 32px; }
    .admin-logo-icon { width: 60px; height: 60px; background: var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="admin-logo">
      <div class="admin-logo-icon">🔐</div>
      <h3 style="margin-bottom:4px;">Admin Portal</h3>
      <p style="color:var(--text-muted);font-size:14px;">Urban Hairplaza Management</p>
    </div>
    <div id="error-banner" style="display:none;padding:12px 16px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:var(--radius-sm);color:#f87171;font-size:14px;margin-bottom:16px;"></div>
    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Admin username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Admin password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-btn" class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;">Login →</button>
    </form>
    <div style="text-align:center;margin-top:24px;">
      <a href="../index.html" style="color:var(--text-muted);font-size:13px;">← Back to Website</a>
    </div>
  </div>
  <script>
    // Redirect if already admin
    fetch('/api/admin/me').then(r => { if (r.ok) window.location.href = 'dashboard.html'; }).catch(()=>{});

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Logging in…';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid credentials');
        window.location.href = 'dashboard.html';
      } catch (err) {
        const el = document.getElementById('error-banner');
        el.textContent = '❌ ' + err.message; el.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Login →';
    });
  </script>
</body>
</html>
